# Actions are pinned to full-length commit SHAs - a version tag is a moving
# target that the action's owner can repoint at any commit, and a workflow that
# can write to this repository is a bad place for that. The comment beside each
# SHA is the release it was taken from; to update one, resolve the tag again
# rather than replacing the SHA with the tag.
#
#   git ls-remote --tags https://github.com/actions/checkout | grep 'v7.0.1$'
#
# An annotated tag needs the dereferenced line - refs/tags/x^{} - which is the
# commit; the bare line is the tag object and will not be accepted.

name: ci

on:
  push:
    branches: [master]
    tags: ['*']
  pull_request:
  workflow_dispatch:

# One run per branch or PR. A push that lands while an earlier one is still
# going makes the earlier one irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Read-only by default; the release job widens this for itself alone.
permissions:
  contents: read

jobs:
  tests:
    name: tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # 8.3 is the floor composer.json declares.
        php: ['8.3']

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - run: composer install --no-interaction --prefer-dist --no-progress

      # analyse then test, which is what `composer check` runs locally. Not
      # `composer check` itself, so that a failure names which of the two.
      - run: php vendor/bin/phpstan analyse --no-progress

      # The suite generates throwaway keys and verifies signatures with the
      # runner's own ssh-keygen; it makes no network requests.
      - run: php vendor/bin/pest

  build:
    name: compiled binary
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # app:build takes its version from `git describe`, so the tags have to
          # be here or the artefact announces itself as "unreleased"
          fetch-depth: 0

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          coverage: none
          # box writes a phar, which php refuses to do by default
          ini-values: phar.readonly=0

      - run: composer install --no-interaction --prefer-dist --no-progress

      - name: Compile
        # composer build installs --no-dev, compiles, restores, and then fails
        # if laravel/pint is still findable in the artefact. app:build never
        # runs composer and box.json takes vendor/ wholesale, so building from a
        # dev checkout compiles the dev dependencies in.
        run: composer build

      - name: It runs, and signs
        # Everything here is about the ARTEFACT rather than the source: box's
        # compactors rewrite what ships, so the suite passing says nothing about
        # whether the phar can still find ssh-keygen and sign. It signs for real
        # with a throwaway key, then stops at the https guard - so this proves
        # the signing path end to end and cannot publish anything.
        run: |
          ./builds/devnull --version

          # Exactly the commands a user should see. laravel/mcp registers its generators and
          # the inspector lazily, which Laravel Zero's commands.remove misses without
          # App\Kernel - so a new package command arrives here unannounced unless this fails.
          listed=$(./builds/devnull list --raw | awk '{print $1}' | sort | tr '\n' ' ')
          if [ "$listed" != "commit keygen keys mcp:start " ]; then
            echo "The binary lists: $listed"
            exit 1
          fi

          ./builds/devnull keygen "$RUNNER_TEMP/ci_ed25519" > /dev/null

          set +e
          out=$(DEVNULL_URL=http://example.invalid DEVNULL_KEY="$RUNNER_TEMP/ci_ed25519.pub" \
            ./builds/devnull commit 'From CI: this must never be sent.' 2>&1)
          code=$?
          set -e

          echo "$out"

          if [ "$code" -eq 0 ] || ! echo "$out" | grep -q 'not an https:// URL'; then
            echo 'The commit did not stop at the https guard.'
            exit 1
          fi

      - name: The MCP server answers, and only in JSON-RPC
        # Handshake and tool list only - no tool is called, so nothing reaches the site. Box's
        # compactor rewrites the PHP it packs, and the tools are declared in attributes, so
        # this is what proves they survive the build. Any stdout line that is not JSON fails
        # the parse: under mcp:start stdout is the protocol.
        run: |
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            | timeout 30 ./builds/devnull mcp:start devnull \
            | python3 -c '
          import json, sys
          tools = []
          for line in sys.stdin:
              message = json.loads(line)
              tools += [t["name"] for t in message.get("result", {}).get("tools", [])]
          print(tools)
          assert sorted(tools) == ["commit", "user", "user-commits"], tools
          '

  release:
    name: publish the release
    runs-on: ubuntu-latest

    # Only a tag publishes, and only after everything else has passed.
    needs: [tests, build]
    if: startsWith(github.ref, 'refs/tags/')

    # The only job that may write to the repository, and it says so here rather
    # than at the top of the file.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # see the build job - without the history the release announces itself
          # as "unreleased"
          fetch-depth: 0

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          coverage: none
          ini-values: phar.readonly=0

      - run: composer install --no-interaction --prefer-dist --no-progress

      - name: Compile
        # Compiled here rather than carried over from the build job, which would
        # cost two more actions to pin and keep current; the same commit
        # compiles to the same thing, and the check below runs on what ships.
        run: composer build

      - name: It announces the tag it was built from
        # config/app.php holds `app('git.version')`, and app:build compiles the
        # result in as a literal. A tag-triggered build cannot get the order
        # wrong, and this asserts it anyway.
        run: |
          built=$(./builds/devnull --version | awk '{print $NF}')

          if [ "$built" != "$GITHUB_REF_NAME" ]; then
            echo "The binary says [$built] but the tag is [$GITHUB_REF_NAME]."
            exit 1
          fi

          echo "$built"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The README's install block fetches devnull-<version> and runs
          # `sha256sum --ignore-missing -c SHA256SUMS`, which only matches
          # because the name INSIDE the sums file is the downloaded filename.
          # Do not rename either asset without changing the README with it.
          cd builds
          mv devnull "devnull-$GITHUB_REF_NAME"
          sha256sum "devnull-$GITHUB_REF_NAME" > SHA256SUMS
          cat SHA256SUMS
          cd ..

          # The hand-written entry for this version. Stops at the next heading,
          # or at a link-reference footer if the changelog ever grows one.
          awk -v tag="$GITHUB_REF_NAME" '
            $0 ~ "^## \\[" tag "\\]" { found = 1; next }
            found && /^## / { exit }
            found && /^\[.*\]: http/ { exit }
            found { print }
          ' CHANGELOG.md > body.md

          {
            echo "Needs PHP 8.3 or newer and OpenSSH 8.1 or newer. Download both assets,"
            echo "keep the binary named \`devnull-$GITHUB_REF_NAME\` so the checksum matches,"
            echo "and verify with \`sha256sum --ignore-missing -c SHA256SUMS\` before installing it."
            echo
          } | cat - body.md > notes.md

          # Falls back to generated notes rather than failing the release if the
          # changelog section is missing.
          if [ ! -s body.md ]; then
            gh release create "$GITHUB_REF_NAME" \
              "builds/devnull-$GITHUB_REF_NAME" builds/SHA256SUMS \
              --title "$GITHUB_REF_NAME" --verify-tag --generate-notes
          else
            gh release create "$GITHUB_REF_NAME" \
              "builds/devnull-$GITHUB_REF_NAME" builds/SHA256SUMS \
              --title "$GITHUB_REF_NAME" --verify-tag --notes-file notes.md
          fi
